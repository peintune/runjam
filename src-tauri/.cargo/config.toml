# Fix: VS 2026 Insiders' link.exe and lib.exe import API sets
# (api-ms-win-core-memory-l1-1-5/6.dll) unavailable on Windows 10 1709
# (build 16299), causing 0xC0000139 (STATUS_ENTRYPOINT_NOT_FOUND).
# Use LLD (bundled with Rust) as a drop-in replacement:
#   - link-wrapper.bat  → lld-link (COFF mode) for linking
#   - lib-wrapper.bat   → lld-link /lib for static library creation
# Both wrappers add a brief delay so Windows releases the output file
# handle before cargo tries to execute it (avoids "Access denied" os
# error 5 on this Windows build).
[target.x86_64-pc-windows-msvc]
linker = "C:\\projects\\runjam\\src-tauri\\link-wrapper.bat"

[env]
AR_x86_64_pc_windows_msvc = "C:\\projects\\runjam\\src-tauri\\lib-wrapper.bat"
