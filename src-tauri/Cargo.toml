[package]
name = "runjam"
version = "1.0.86"
description = "RunJam — A unified desktop manager for AI coding agents"
authors = ["RunJam Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/peintune/runjam"
homepage = "https://github.com/peintune/runjam"

[lib]
name = "runjam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
keyring = "3"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
directories = "5"
toml = "1.1.2"
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json", "socks-proxy"] }
portable-pty = "0.7"
zip = "2"
base64 = "0.22"
quick-xml = "0.36"
calamine = "0.25"
pdf-extract = "0.7"
uuid = { version = "1", features = ["v4"] }
url = "2"

