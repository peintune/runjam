<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .layer-label { font-size: 12px; font-weight: 600; fill: #94a3b8; letter-spacing: 1.5px; }
    .box-title { font-size: 15px; font-weight: 600; fill: #0f172a; }
    .box-sub { font-size: 11.5px; fill: #64748b; }
    .box-sub-strong { font-size: 12px; font-weight: 600; fill: #334155; }
    .center-title { font-size: 18px; font-weight: 700; fill: #ffffff; }
    .center-sub { font-size: 12px; fill: #c7d2fe; }
