    .surface-title { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .surface-sub { font-size: 10.5px; fill: #c7d2fe; }
    .pain-text { font-size: 11.5px; fill: #475569; }
    .pain-num { font-size: 11px; font-weight: 700; fill: #6366f1; }
    .pain-title { font-size: 11.5px; font-weight: 600; fill: #334155; }
    .pain-desc { font-size: 9.5px; fill: #64748b; }
    .pain-fix { font-size: 10px; font-weight: 700; }
    .legend-text { font-size: 11.5px; fill: #475569; }
  </style>
  <defs>
    <linearGradient id="runjamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="localGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
