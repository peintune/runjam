name: Build & Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Windows x64 ──────────────────────────────────
  build-windows:
    runs-on: windows-latest
    env:
      # ── SignPath Foundation 代码签名（免费，开源项目专用）────────────
      # 不配置 → 安装包未签名 → SmartScreen 拦截（"Windows 已保护你的电脑"）
      #          + UAC 显示"发布者: 未知" + 浏览器标记"不常见的下载"。
      # 配置后 → 下方 SignPath 签名步骤自动生效，未配置则原样发布未签名包。
      #
      # 为什么用 SignPath 而不是自己买证书：
      #   2023-06-01 起 CA/B 论坛要求 OV/IV 代码签名私钥必须存于 FIPS 140-2 L2
      #   硬件 token 或云 HSM，CA 不再签发可下载的 .pfx —— 自建 CI 里没法用
      #   signtool 直接签。SignPath 把签名放在云端 HSM 完成，且对 OSS 项目免费。
      #   注：2024-03 起 EV 证书已无 SmartScreen 特权，故这里不需要 EV。
      #
      # 需要的 Repo 变量/密钥（申请与取值见 docs/signing-signpath.md）:
      #   secrets.SIGNPATH_API_TOKEN                   SignPath CI 用户 API token
      #   vars.SIGNPATH_ORGANIZATION_ID                SignPath 组织 ID (UUID)
      #   vars.SIGNPATH_PROJECT_SLUG                   项目 slug，如 runjam
      #   vars.SIGNPATH_SIGNING_POLICY_SLUG            签名策略 slug，如 release-signing
      #   vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG    (可选) 制品配置 slug
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install unzip (needed by build.rs)
        run: choco install unzip -y --no-progress

      - name: Install dependencies (npm)
        run: npm ci

      - name: Prepare platform resources
        run: node scripts/sync-resources.mjs
        env:
          TAURI_ENV_PLATFORM: windows
          TAURI_ENV_ARCH: x86_64

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit platform target so that `pretauri` sync-resources.mjs
          # and `beforeBuildCommand` preinstall-claude-acp.mjs (both spawned
          # inside tauri-action) pick the right host==target platform
          # instead of relying on the host's process.platform (which is
          # fine here on x64 Windows, but set for consistency).
          TAURI_ENV_PLATFORM_TARGET: x86_64-pc-windows-msvc
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── SignPath Foundation 代码签名（免费，消除 SmartScreen 拦截）──────
      #
      # 未签名的 NSIS 安装包会触发：
      #   1. SmartScreen: "Windows 已保护你的电脑"（需点"更多信息 → 仍要运行"）
      #   2. UAC 弹窗: "发布者: 未知"
      #   3. Edge/Chrome: "此文件不常见，可能有危险"
      #
      # SignPath 的校验要求（docs.signpath.io/trusted-build-systems/github）:
      #   - 制品必须先作为 workflow artifact 上传，才能提交签名请求
      #   - OSS 项目要求：本次 workflow 的所有 job 都跑在 GitHub-hosted runner 上
      #     （本文件全部使用 windows-latest / macos-* / ubuntu-latest，已满足）
      #   - upload-artifact 默认打成 ZIP，因此 SignPath 侧 Artifact Configuration
      #     根元素必须是 <zip-file>（配置见 docs/signing-signpath.md）
      #
      # 关键顺序：Tauri updater 的 .sig 是对文件字节做 minisign 校验的，签名会
      # 改变文件字节，所以必须「签名 → 重签 .sig」，否则用户自动更新会校验失败。
      - name: Stage unsigned installer for SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: |
          mkdir -p unsigned-installer
          cp src-tauri/target/release/bundle/nsis/RunJam_*_x64-setup.exe unsigned-installer/
          ls -l unsigned-installer/

      # 名字刻意不含 runjam 前缀：create-release 用 pattern 'runjam-*' 收集产物，
      # 若被匹配会把未签名包一起打进 Release。
      - name: Upload unsigned installer artifact
        id: upload-unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-installer-tmp
          path: unsigned-installer/*
          if-no-files-found: error

      - name: Submit SignPath signing request
        id: signpath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Install signed build and regenerate updater signature
        if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          NSIS_DIR="src-tauri/target/release/bundle/nsis"
          UNSIGNED="$(ls "$NSIS_DIR"/RunJam_*_x64-setup.exe | head -n1)"
          NAME="$(basename "$UNSIGNED")"

          # zip 内目录结构不保证平铺，用 find 定位而不是假定路径
          SIGNED="$(find signed-installer -type f -name "$NAME" | head -n1)"
          if [[ -z "$SIGNED" ]]; then
            echo "::error::SignPath 未产出签名文件 $NAME"
            find signed-installer -type f | head -n 50
            exit 1
          fi
          cp -f "$SIGNED" "$UNSIGNED"
          echo "✅ 已替换为 SignPath 签名版: $NAME"

          # 字节已改变，原 .sig 失效，用同一把 Tauri 私钥重签
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::已启用 SignPath 签名，但缺少 TAURI_SIGNING_PRIVATE_KEY，无法重签 .sig"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/tauri-updater.key"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_FILE"
          rm -f "$UNSIGNED.sig"
          npx --yes @tauri-apps/cli@^2 signer sign \
            --private-key "$KEY_FILE" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$UNSIGNED"
          rm -f "$KEY_FILE"
          ls -l "$UNSIGNED.sig"
          echo "✅ updater 签名已重新生成"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: runjam-windows-x64
          path: |
            src-tauri\target\release\bundle\nsis\*.exe
            src-tauri\target\release\bundle\nsis\*.exe.sig

  # ── macOS x64 ────────────────────────────────────
  build-macos-x64:
    runs-on: macos-15  # Apple Silicon, cross-compile to x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install dependencies (npm)
        run: npm ci

      - name: Prepare platform resources
        run: node scripts/sync-resources.mjs
        env:
          TAURI_ENV_PLATFORM_TARGET: x86_64-apple-darwin

      - name: Build Tauri (macOS Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CRITICAL: tauri-action spawns `pretauri` sync-resources.mjs and
          # `beforeBuildCommand` preinstall-claude-acp.mjs as subprocesses.
          # The macOS x64 job runs on Apple Silicon runners — without these
          # env vars, both scripts fall back to `process.platform/arch`
          # (darwin arm64) and bundle the WRONG platform binaries
          # (llama-server macos-aarch64 instead of macos-x86_64, and the
          # wrong claude-agent-sdk optional dependency).
          TAURI_ENV_PLATFORM_TARGET: x86_64-apple-darwin
          # createUpdaterArtifacts is global (not per-platform), so macOS also
          # tries to emit an updater .sig. Provide the signing key so the build
          # succeeds; the macOS updater artifact is unused (macOS uses the
          # browser-download path) but harmless.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target x86_64-apple-darwin

      - name: Deep-sign embedded binaries (macOS x64)
        run: |
          APP_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/RunJam.app"
          if [ ! -d "$APP_DIR" ]; then echo "App bundle not found at $APP_DIR"; exit 1; fi
          # 1) Ad-hoc sign every Mach-O binary inside Resources/ (nodejs/, binaries/, agents)
          #    Apple Silicon Gatekeeper requires ALL embedded executables signed or the
          #    whole app is flagged "damaged".
          find "$APP_DIR/Contents/Resources" -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -print0 | \
            xargs -0 -I{} codesign --force --deep --sign - --timestamp=none --preserve-metadata=identifier,entitlements,flags "{}" 2>/dev/null || true
          # 2) Re-sign the frameworks directory
          find "$APP_DIR/Contents/Frameworks" -type f -name "*.dylib" -o -name "*.framework" 2>/dev/null | \
            xargs -I{} codesign --force --deep --sign - --timestamp=none --preserve-metadata=identifier,entitlements,flags "{}" 2>/dev/null || true
          # 3) Re-sign the main app with entitlements (overwrite Tauri's default signature
          #    which misses entitlements on unsigned ad-hoc builds)
          ENTITLEMENTS="$GITHUB_WORKSPACE/src-tauri/RunJam.entitlements"
          if [ -f "$ENTITLEMENTS" ]; then
            codesign --force --deep --sign - --timestamp=none \
              --entitlements "$ENTITLEMENTS" \
              --preserve-metadata=identifier,flags \
              "$APP_DIR"
          else
            codesign --force --deep --sign - --timestamp=none \
              --preserve-metadata=identifier,entitlements,flags \
              "$APP_DIR"
          fi
          # 4) Verify
          codesign --verify --deep --strict "$APP_DIR" && echo "✅ codesign verify passed"
          # 5) 重新打包 DMG，内含 Applications 拖拽快捷方式。
          #    注意：不能直接 `hdiutil create -srcfolder "$APP_DIR"` —— 那样镜像里
          #    只有 RunJam.app，没有 /Applications 软链接，用户打开 DMG 后看不到
          #    "拖到 Applications" 的图标。make-dmg.sh 会先组装 staging 目录。
          #    可选第 3 个参数传背景图 PNG → 生成带背景图/图标定位的美化版。
          DMG_OUT="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"
          mkdir -p "$DMG_OUT"
          rm -f "$DMG_OUT"/*.dmg
          VERSION=$(node -p "require('./package.json').version")
          chmod +x scripts/make-dmg.sh
          bash scripts/make-dmg.sh "$APP_DIR" "$DMG_OUT/RunJam_${VERSION}_x64.dmg"

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v5
        with:
          name: runjam-macos-x64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  # ── macOS ARM (Apple Silicon) ────────────────────
  build-macos-arm:
    runs-on: macos-latest  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (npm)
        run: npm ci

      - name: Prepare platform resources
        run: node scripts/sync-resources.mjs
        env:
          TAURI_ENV_PLATFORM: macos
          TAURI_ENV_ARCH: aarch64

      - name: Build Tauri (macOS ARM)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit target so `pretauri` and `beforeBuildCommand` scripts
          # inside tauri-action don't depend on process.platform/arch
          # (matches host here but set for robustness & consistency).
          TAURI_ENV_PLATFORM_TARGET: aarch64-apple-darwin
          # createUpdaterArtifacts is global (not per-platform), so macOS also
          # tries to emit an updater .sig. Provide the signing key so the build
          # succeeds; the macOS updater artifact is unused (macOS uses the
          # browser-download path) but harmless.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Deep-sign embedded binaries (macOS ARM)
        run: |
          APP_DIR="src-tauri/target/release/bundle/macos/RunJam.app"
          if [ ! -d "$APP_DIR" ]; then echo "App bundle not found at $APP_DIR"; exit 1; fi
          # 1) Ad-hoc sign every Mach-O binary inside Resources/ (nodejs/, binaries/, agents).
          #    On Apple Silicon this is MANDATORY — any unsigned executable in the bundle
          #    triggers Gatekeeper's "is damaged and can't be opened" on launch.
          find "$APP_DIR/Contents/Resources" -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -print0 | \
            xargs -0 -I{} codesign --force --deep --sign - --timestamp=none --preserve-metadata=identifier,entitlements,flags "{}" 2>/dev/null || true
          # 2) Frameworks
          find "$APP_DIR/Contents/Frameworks" -type f -name "*.dylib" -o -name "*.framework" 2>/dev/null | \
            xargs -I{} codesign --force --deep --sign - --timestamp=none --preserve-metadata=identifier,entitlements,flags "{}" 2>/dev/null || true
          # 3) Re-sign main app with our entitlements.
          ENTITLEMENTS="$GITHUB_WORKSPACE/src-tauri/RunJam.entitlements"
          if [ -f "$ENTITLEMENTS" ]; then
            codesign --force --deep --sign - --timestamp=none \
              --entitlements "$ENTITLEMENTS" \
              --preserve-metadata=identifier,flags \
              "$APP_DIR"
          else
            codesign --force --deep --sign - --timestamp=none \
              --preserve-metadata=identifier,entitlements,flags \
              "$APP_DIR"
          fi
          # 4) Verify signature & spctl assessment
          codesign --verify --deep --strict "$APP_DIR" && echo "✅ codesign verify passed"
          # NOTE: spctl --assess will FAIL on ad-hoc signed builds (-s "-")
          # because ad-hoc signatures have no certificate chain. That's expected.
          # It will pass once you add Developer ID signing + notarization (step below).
          # To let users bypass: xattr -rd com.apple.quarantine /Applications/RunJam.app

          # 5) 重新打包 DMG，内含 Applications 拖拽快捷方式。
          #    不能直接 `hdiutil create -srcfolder "$APP_DIR"` —— 那样镜像里只有
          #    RunJam.app，没有 /Applications 软链接，打开 DMG 后没有可拖放的
          #    Applications 图标。make-dmg.sh 会先组装 staging 目录再打包。
          #    可选第 3 个参数传背景图 PNG → 生成带背景图/图标定位的美化版。
          DMG_OUT="src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_OUT"
          rm -f "$DMG_OUT"/*.dmg
          VERSION=$(node -p "require('./package.json').version")
          chmod +x scripts/make-dmg.sh
          bash scripts/make-dmg.sh "$APP_DIR" "$DMG_OUT/RunJam_${VERSION}_aarch64.dmg"

      # Optional — Developer ID + Notarization (removes the need for xattr workaround).
      # Uncomment and add the following GitHub Repo Secrets to enable:
      #   APPLE_CERTIFICATE        → base64-encoded .p12
      #   APPLE_CERTIFICATE_PWD    → .p12 password
      #   APPLE_ID                 → your Apple ID email
      #   APPLE_APP_PASSWORD       → app-specific password
      #   APPLE_TEAM_ID            → 10-char Team ID
      # - name: Notarize macOS ARM
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PWD: ${{ secrets.APPLE_CERTIFICATE_PWD }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     # import certificate into keychain, sign with Developer ID, then
      #     # xcrun notarytool submit --wait, then xcrun stapler staple the dmg.
      #     echo "See tauri.app docs for full notarization script"

      - name: Upload macOS ARM artifacts
        uses: actions/upload-artifact@v5
        with:
          name: runjam-macos-arm
          path: src-tauri/target/release/bundle/dmg/*.dmg

  # ── Create GitHub Release (only on tags) ────────
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos-x64, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: runjam-*
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: true
          generate_release_notes: true

      # ── Push build artifacts to Aliyun OSS (release tags only) ──
      # This job already runs `if: startsWith(github.ref, 'refs/tags/v')`,
      # so OSS upload happens ONLY for release builds (tag v*), never on
      # PR / workflow_dispatch without a tag.
      # Required repo secrets:
      #   ALIYUN_OSS_ACCESS_KEY_ID     – Aliyun AccessKey ID
      #   ALIYUN_OSS_ACCESS_KEY_SECRET – Aliyun AccessKey Secret
      #   OSS_ENDPOINT          – e.g. https://oss-cn-hangzhou.aliyuncs.com
      #   OSS_BUCKET            – bucket name, e.g. runjam-releases
      #   OSS_REGION            – (optional) e.g. cn-hangzhou; if unset, it is
      #                           inferred from OSS_ENDPOINT (oss-<region>.aliyuncs.com).
      #                           Required when OSS_ENDPOINT is a custom domain.
      - name: Upload to Aliyun OSS (release only)
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
        run: |
          # Install official ossutil 2.3.0 (Linux amd64, matches ubuntu-latest)
          curl -sL -o /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          unzip -q /tmp/ossutil.zip -d /tmp/ossutil
          sudo mv /tmp/ossutil/ossutil-2.3.0-linux-amd64/ossutil /usr/local/bin/ossutil

          # ossutil 2.x signs requests with SigV4 by default, which REQUIRES
          # --region. Prefer the explicit ALIYUN_OSS_REGION secret; otherwise infer it
          # from the endpoint (https://oss-cn-hangzhou.aliyuncs.com -> cn-hangzhou).
          if [ -n "$ALIYUN_OSS_REGION" ]; then
            REGION="$ALIYUN_OSS_REGION"
          else
            REGION=$(printf '%s' "$ALIYUN_OSS_ENDPOINT" | sed -nE 's#^https?://oss-([^./]+).*$#\1#p' || true)
          fi
          if [ -z "$REGION" ]; then
            echo "Error: cannot determine OSS region. Set the ALIYUN_OSS_REGION repo secret (e.g. cn-hangzhou)." >&2
            exit 1
          fi
          echo "OSS region: $REGION"

          # Upload all platform artifacts to oss://<bucket>/runjam/releases/<tag>/
          ossutil cp -r -f artifacts/ "oss://$ALIYUN_OSS_BUCKET/runjam/releases/${{ github.ref_name }}/" \
            -e "$ALIYUN_OSS_ENDPOINT" -i "$ALIYUN_OSS_ACCESS_KEY_ID" -k "$ALIYUN_OSS_ACCESS_KEY_SECRET" --region "$REGION"